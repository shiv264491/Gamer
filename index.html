<style>
:root{--bg:#f3f7fc;--card:#fff;--tx:#0d1b2e;--mu:#5b6f86;--line:#d9e3ef;--inp:#f7faff;--cy:#0891b2;--bl:#1d6bff;--ok:#0f9f64;--wa:#d98300;--er:#e11d48;--sh:0 6px 24px #1d4e8914;--btxt:#fff;--hd:#ffffffd9}
[data-theme=dark]{--bg:#050b14;--card:#0b1a2b;--tx:#e6f4ff;--mu:#8aa7bd;--line:#1c3a56;--inp:#06121f;--cy:#22d3ee;--bl:#2f8cff;--ok:#22e58b;--wa:#ffb020;--er:#ff4d6d;--sh:0 0 22px #22d3ee1a;--btxt:#00121f;--hd:#050b14e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,'Segoe UI',Roboto,system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header img{height:42px;width:42px;object-fit:cover;border-radius:10px}header b{font:700 18px Rajdhani,Inter,sans-serif;letter-spacing:2px;background:linear-gradient(90deg,var(--bl),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}#na{display:contents}nav a{color:var(--tx);text-decoration:none;padding:7px 11px;border-radius:9px;font-weight:600;font-size:14px}nav a:hover,nav a.on{background:var(--line);color:var(--cy)}
#tg{background:var(--line);border:0;border-radius:50%;width:36px;height:36px;font-size:17px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px 14px 60px;animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,h2,h3{margin:.4em 0;font-family:Rajdhani,Inter,sans-serif;letter-spacing:1px}h1{font-size:clamp(26px,6vw,42px)}
a{color:var(--cy)}
.hero{text-align:center;padding:26px 14px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#1d6bff,#0ac7e8 70%,#12e3c0);box-shadow:var(--sh)}
[data-theme=dark] .hero{background:linear-gradient(135deg,#0b2a4d,#0a4a63 70%,#0a6a70)}
.hero img{width:130px;max-width:40%;border-radius:20px;box-shadow:0 8px 30px #0006}.hero h1{margin:.3em 0;color:#fff}.hero .mu{color:#e6fbff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--sh);transition:.25s}.card:hover{border-color:var(--cy);transform:translateY(-2px)}
.btn{background:linear-gradient(90deg,var(--bl),var(--cy));color:var(--btxt);border:0;border-radius:10px;padding:10px 18px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block;transition:.2s;margin:2px 0}
.hero .btn.g{color:#fff;border-color:#fff}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.g{background:transparent;color:var(--cy);border:1.5px solid var(--cy)}.btn.r{background:var(--er);color:#fff}.btn.o{background:var(--ok);color:#fff}
input,textarea,select{width:100%;background:var(--inp);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;margin:4px 0 10px}input:focus,textarea:focus{outline:0;border-color:var(--cy);box-shadow:0 0 0 3px #22d3ee33}
label{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.slot{border:1.5px solid;border-radius:12px;padding:9px;text-align:center;font-size:12px;cursor:pointer;background:var(--card)}.slot b{font-size:20px;display:block}
.slot.available{border-color:var(--ok);color:var(--ok)}.slot.available:hover{transform:scale(1.05);box-shadow:0 4px 14px #0f9f6455}.slot.pending{border-color:var(--wa);color:var(--wa);cursor:not-allowed}.slot.booked{border-color:var(--er);color:var(--er);cursor:not-allowed;opacity:.6}
.tag{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid}.CONFIRMED{color:var(--ok)}.PENDING_VERIFICATION,.AWAITING_PAYMENT{color:var(--wa)}.REJECTED,.EXPIRED{color:var(--er)}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;justify-content:center;overflow:auto;padding:14px}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:470px;margin:auto;box-shadow:0 20px 60px #0006}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}.stat b{font-size:28px;color:var(--cy);display:block}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--cy);font-size:12px;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mu{color:var(--mu)}.err{color:var(--er);min-height:20px;font-size:14px}.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--cy);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}@keyframes s{to{transform:rotate(360deg)}}
.zoom{overflow:auto;max-height:80vh}.zoom img{width:100%;cursor:zoom-in}.zoom img.z{width:200%;cursor:zoom-out}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
</style>
<script>document.documentElement.dataset.theme=localStorage.getItem('ftw_theme')||'light'</script>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN=sessionStorage.getItem('ftw_admin')||'';
// ===== Firebase backend (Auth + Firestore) =====
const OWNER_EMAIL='zdxyzofficial60@gmail.com';
firebase.initializeApp({apiKey:"AIzaSyBXi0DCJOZy3gwDl9lSZJNZ1Mq96PYxBXQ",authDomain:"gamer-4e5ea.firebaseapp.com",projectId:"gamer-4e5ea",storageBucket:"gamer-4e5ea.firebasestorage.app",messagingSenderId:"576364174722",appId:"1:576364174722:web:06c2ae1d7feebafc5e039b"});
const auth=firebase.auth(),fs=firebase.firestore(),HOLD=600000;
const ready=new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x)})});
const bad=m=>{throw new Error(m)},C=n=>fs.collection(n),dat=s=>s.docs.map(d=>d.data()),S=n=>String(n);
const okMob=m=>/^[6-9]\d{9}$/.test(m||''),okMail=e=>/^[^\s@]{1,64}@[^\s@]{1,255}$/.test(e||''),okNm=n=>/^[\p{L}0-9 ._'-]{2,40}$/u.test(n||''),pwOk=p=>{if(String(p||'').length<6)bad('Password must be at least 6 characters')};
const isAdm=()=>!!auth.currentUser&&(auth.currentUser.email||'').toLowerCase()===OWNER_EMAIL.toLowerCase();
const eff=x=>x.status==='pending'&&x.hold<Date.now()?'available':x.status;
const FE={'auth/email-already-in-use':'This email is already registered','auth/invalid-credential':'Wrong email or password','auth/wrong-password':'Wrong email or password','auth/user-not-found':'No account with this email','auth/weak-password':'Password must be at least 6 characters','auth/too-many-requests':'Too many attempts. Try later','auth/invalid-email':'Invalid email','auth/requires-recent-login':'Please logout, login again and retry','permission-denied':'Not allowed (check Firestore rules / login)','unavailable':'Network problem. Try again'};
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};i.onerror=()=>no(new Error('Invalid image'));i.src=URL.createObjectURL(f)});
async function commit(ops){for(let i=0;i<ops.length;i+=400){const B=fs.batch();ops.slice(i,i+400).forEach(f=>f(B));await B.commit()}}
async function api(p,o={}){try{return await R(p,o)}catch(e){throw new Error(FE[e.code]||e.message||'Something went wrong')}}
const mBody=b=>{if(String(b.name||'').trim().length<2)bad('Match name required');if(!/^\d{4}-\d{2}-\d{2}$/.test(b.match_date))bad('Invalid date');if(!/^\d{2}:\d{2}$/.test(b.match_time))bad('Invalid time');if(!(+b.total_slots>=1&&+b.total_slots<=500))bad('Slots must be 1-500');if(!(+b.price>=1))bad('Price must be >= 1')};
const mkSlot=(mid,n,price)=>B=>B.set(C('slots').doc(S(mid*1000+n)),{id:mid*1000+n,match_id:mid,number:n,price,status:'available',uid:null,booking_id:null,hold:0});
async function resize(mid,n,price){const sl=dat(await C('slots').where('match_id','==',mid).get()),max=Math.max(0,...sl.map(x=>x.number)),ops=[];
 if(n>max)for(let i=max+1;i<=n;i++)ops.push(mkSlot(mid,i,price));
 else if(n<max){const rm=sl.filter(x=>x.number>n);if(rm.some(x=>eff(x)!=='available'))bad('Cannot remove slots that have pending or confirmed bookings');rm.forEach(x=>ops.push(B=>B.delete(C('slots').doc(S(x.id)))))}
 sl.filter(x=>eff(x)==='available'&&x.number<=n).forEach(x=>ops.push(B=>B.update(C('slots').doc(S(x.id)),{price})));await commit(ops)}
const getBk=async(code,me)=>{if(!me)bad('Please login first');const q=await C('bookings').where('uid','==',me.uid).where('code','==',code).get();if(q.empty)bad('Booking not found');return q.docs[0].data()};
async function R(p,o){const M=o.method||'GET',b=o.body,[path,qs]=p.split('?'),s=path.split('/').slice(2);await ready;const me=auth.currentUser;
 // ---- public ----
 if(s[0]==='matches'&&!s[1]){const sl=dat(await C('slots').get()),ms=dat(await C('matches').get());
  return ms.map(m=>{const x=sl.filter(y=>y.match_id===m.id);return{...m,total:x.length,available:x.filter(y=>eff(y)==='available').length,price:x.length?Math.min(...x.map(y=>y.price)):0}}).sort((a,c)=>(a.match_date+a.match_time).localeCompare(c.match_date+c.match_time))}
 if(s[0]==='matches')return dat(await C('slots').where('match_id','==',+s[1]).get()).sort((a,c)=>a.number-c.number).map(x=>({id:x.id,number:x.number,price:x.price,status:eff(x)}));
 // ---- gamer auth ----
 if(s[0]==='auth'){
  if(s[1]==='signup'){if(!okNm(b.name))bad('Enter a valid name');if(!okMob(b.mobile))bad('Enter a valid 10-digit mobile');if(!okMail(b.email))bad('Enter a valid email');pwOk(b.password);
   if(b.email.trim().toLowerCase()===OWNER_EMAIL.toLowerCase())bad('This email cannot be used');
   const c=await auth.createUserWithEmailAndPassword(b.email.trim(),b.password);
   try{const B=fs.batch();B.set(C('mobiles').doc(b.mobile),{uid:c.user.uid});B.set(C('users').doc(c.user.uid),{id:c.user.uid,name:b.name.trim(),mobile:b.mobile,email:b.email.trim(),game_id:'',ign:'',created:Date.now()});await B.commit()}
   catch(e){await c.user.delete();bad('This mobile number is already registered')}
   return{id:c.user.uid}}
  if(s[1]==='login'){const c=await auth.signInWithEmailAndPassword(String(b.email||'').trim(),b.password||'');if(isAdm()){await auth.signOut();bad('Please use Admin login')}return{id:c.user.uid}}
  if(s[1]==='forgot'){await auth.sendPasswordResetEmail(String(b.email||'').trim());return{ok:1}}
  if(!me||isAdm())bad('Please login first');const ref=C('users').doc(me.uid);
  if(M==='GET'){const d=await ref.get();if(!d.exists)bad('Profile not found');return d.data()}
  if(!okNm(b.name))bad('Enter a valid name');if(!okMob(b.mobile))bad('Enter a valid 10-digit mobile');if(b.game_id&&!/^[A-Za-z0-9_-]{4,20}$/.test(b.game_id))bad('Invalid game ID');
  const old=(await ref.get()).data(),B=fs.batch();
  if(old.mobile!==b.mobile){B.set(C('mobiles').doc(b.mobile),{uid:me.uid});B.delete(C('mobiles').doc(old.mobile))}
  B.update(ref,{name:b.name.trim(),mobile:b.mobile,game_id:b.game_id||'',ign:b.ign||''});
  try{await B.commit()}catch(e){bad('This mobile number is already used by another account')}
  if(b.password){pwOk(b.password);await me.updatePassword(b.password)}return(await ref.get()).data()}
 // ---- booking ----
 if(s[0]==='book'){if(!me||isAdm())bad('Please login to book a slot');if(!/^[A-Za-z0-9_-]{4,20}$/.test(b.game_id||''))bad('Enter a valid game ID');if(!okNm(b.ign))bad('Enter a valid in-game name');
  const u=(await C('users').doc(me.uid).get()).data(),mt=(await C('matches').doc(S(+b.match_id)).get()).data();if(!mt||!mt.booking_open)bad('Booking is closed for this match');
  const sref=C('slots').doc(S(+b.slot_id)),bid=Date.now()*1000+Math.floor(Math.random()*1000),code='FTW-'+[...crypto.getRandomValues(new Uint8Array(4))].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();
  try{await fs.runTransaction(async t=>{const x=(await t.get(sref)).data();if(!x||x.match_id!==mt.id||eff(x)!=='available')throw new Error('Slot is no longer available');const hold=Date.now()+HOLD;
   t.update(sref,{status:'pending',uid:me.uid,booking_id:bid,hold});
   t.set(C('bookings').doc(S(bid)),{id:bid,code,uid:me.uid,match_id:mt.id,slot_id:x.id,slot_number:x.number,amount:x.price,match_name:mt.name,match_date:mt.match_date,match_time:mt.match_time,name:u.name,mobile:u.mobile,game_id:b.game_id,ign:b.ign,status:'AWAITING_PAYMENT',created_at:Date.now(),hold})})}
  catch(e){bad(e.code==='permission-denied'?'Slot is no longer available':e.message)}
  await C('users').doc(me.uid).update({game_id:b.game_id,ign:b.ign});return{code}}
 if(s[0]==='booking'){const bk=await getBk(s[1],me);
  if(s[2]==='pay'){if(bk.status!=='AWAITING_PAYMENT')bad('This booking is not awaiting payment');
   const utr=String(b.get('utr')||'').trim().toUpperCase();if(!/^[A-Z0-9]{8,24}$/.test(utr))bad('Enter a valid UTR');const f=b.get('screenshot');if(!f||!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8e6)bad('Upload a JPG/PNG/WEBP image under 8 MB');
   const sl=(await C('slots').doc(S(bk.slot_id)).get()).data();if(!sl||sl.booking_id!==bk.id)bad('Your hold expired and the slot was taken. Please book again.');
   const img=await shrink(f);if(img.length>900000)bad('Image too large');
   const B=fs.batch();B.set(C('utrs').doc(utr),{uid:me.uid,booking:bk.id});B.set(C('shots').doc(S(bk.id)),{uid:me.uid,data:img});
   B.update(C('bookings').doc(S(bk.id)),{status:'PENDING_VERIFICATION',utr,pay_status:'PENDING',paid_at:Date.now()});B.update(C('slots').doc(S(bk.slot_id)),{hold:9e15});
   try{await B.commit()}catch(e){bad('This UTR was already used or the booking changed')}return{ok:1}}
  if(bk.status==='AWAITING_PAYMENT'&&bk.hold<Date.now())bad('Slot hold expired. Please book again.');
  const out={code:bk.code,amount:bk.amount,status:bk.status,match_name:bk.match_name,match_date:bk.match_date,match_time:bk.match_time,slot_number:bk.slot_number};
  if(bk.status==='AWAITING_PAYMENT'){const st=(await C('settings').doc('payment').get()).data()||{};if(!st.upi_id)bad('Payments are not configured yet. Contact support.');
   const link=`upi://pay?pa=${encodeURIComponent(st.upi_id)}&pn=${encodeURIComponent(st.payee||'FTW')}&am=${bk.amount}&cu=INR&tn=${bk.code}`,q=qrcode(0,'M');q.addData(link);q.make();
   Object.assign(out,{upi_id:st.upi_id,payee:st.payee,instructions:st.instructions,upi_link:link,qr:q.createDataURL(6,3)})}return out}
 if(s[0]==='my-bookings'){if(!me)bad('Please login first');return dat(await C('bookings').where('uid','==',me.uid).get()).sort((a,c)=>c.id-a.id).map(x=>x.status==='AWAITING_PAYMENT'&&x.hold<Date.now()?{...x,status:'EXPIRED'}:x)}
 // ---- admin ----
 if(s[0]==='admin'){const a=s[1];

 <h2 style="color:var(--cy)">₹${b.amount}</h2><div style="text-align:center"><img src="${b.qr}" alt="UPI QR" style="width:220px;background:#fff;border-radius:10px;padding:6px"></div>
 <p>UPI: <b>${esc(b.upi_id)}</b> (${esc(b.payee)}) <button class="btn g" onclick="navigator.clipboard.writeText('${esc(b.upi_id)}');this.textContent='Copied!'">Copy UPI ID</button></p>
 <a class="btn o" href="${esc(b.upi_link)}">Pay Now</a><p class="mu" style="white-space:pre-wrap">${esc(b.instructions)}</p><p class="mu">Slot is held for 10 minutes.</p>
 <form onsubmit="submitPay(event,'${esc(code)}')"><label>UTR / Transaction Reference</label><input name="utr" required maxlength="24"><label>Payment Screenshot (JPG/PNG/WEBP, max 3MB)</label>
 <input type="file" name="screenshot" accept="image/*" required><p class="err" id="e"></p><button class="btn">Submit for Verification</button></form>`}catch(x){$('#m>div').innerHTML=`<p class="err">${esc(x.message)}</p><button class="btn g" onclick="closeM()">Close</button>`}}
window.submitPay=async(e,code)=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;
 try{await api(`/api/booking/${code}/pay`,{method:'POST',body:new FormData(e.target)});$('#m>div').innerHTML=`<h3>✅ Submitted</h3><p>Booking <b>${esc(code)}</b> is <b>PENDING VERIFICATION</b>. An admin will verify your payment. Check status in My Bookings.</p><button class="btn" onclick="closeM();route()">Done</button>`}catch(x){$('#e').textContent=x.message;b.disabled=false}};

window.theme=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('ftw_theme',t);$('#tg').textContent=t==='dark'?'☀️':'🌙'};
let MEID=+localStorage.getItem('ftw_me')||0,USER;
async function loadUser(){USER=null;try{USER=await api('/api/auth/profile')}catch{}
 $('#na').innerHTML=USER?`<a href="#/my" id="n2">My Bookings</a><a href="#/profile">👤 ${esc(USER.name.split(' ')[0])}</a><a href="#" onclick="logout();return false">Logout</a>`:`<a href="#" onclick="authM('login');return false">Login</a><a href="#" onclick="authM('signup');return false">Sign Up</a><a href="#admin">Admin</a>`;
 $('#tg').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙'}
window.authM=mode=>{const L=mode==='login';modal(`<h3>${L?'Gamer Login':'Create Gamer Account'}</h3><form onsubmit="doAuth(event,'${mode}')">
 ${L?'<label>Gmail / Email</label><input name="email" type="email" required>':'<label>Full Name</label><input name="name" required><label>Mobile Number</label><input name="mobile" inputmode="numeric" maxlength="10" required><label>Gmail / Email</label><input name="email" type="email" required>'}
 <label>Password</label><input name="password" type="password" minlength="6" required><p class="err" id="e"></p><button class="btn">${L?'Login':'Sign Up'}</button>
 ${L?'<p><a href="#" onclick="forgotM(\'gamer\');return false">Forgot password?</a></p>':''}<p class="mu">${L?'New here?':'Already have an account?'} <a href="#" onclick="authM('${L?'signup':'login'}');return false">${L?'Sign Up':'Login'}</a></p></form>`)};
window.doAuth=async(e,mode)=>{e.preventDefault();try{const r=await api('/api/auth/'+mode,{method:'POST',body:fd(e.target)});MEID=r.id;localStorage.setItem('ftw_me',r.id);closeM();await loadUser();route()}catch(x){$('#e').textContent=x.message}};
window.logout=()=>{auth.signOut().then(()=>{location.hash='#/';loadUser().then(route)})};
window.forgotM=who=>modal(`<h3>Reset Password</h3><p class="mu">We will email you a password reset link.</p><form onsubmit="doForgot(event,'${who}')"><label>Registered Email</label><input name="email" type="email" required><p class="err" id="e"></p><button class="btn">Send Reset Link</button></form>`);
window.doForgot=async(e,who)=>{e.preventDefault();try{await api(who==='admin'?'/api/admin/forgot':'/api/auth/forgot',{method:'POST',body:fd(e.target)});modal('<h3>✅ Email sent</h3><p>Check your inbox (and spam) for the reset link.</p><button class="btn" onclick="closeM()">OK</button>')}catch(x){$('#e').textContent=x.message}};
const sub=(url,after)=>async e=>{e.preventDefault();const er=$('#e');try{const r=await api(url,{method:'PUT',body:fd(e.target)});er.style.color='var(--ok)';er.textContent='Saved ✓';after&&after(r)}catch(x){er.style.color='var(--er)';er.textContent=x.message}};
function profile(){if(!USER){authM('login');return home()}const u=USER;
 app.innerHTML=`<h1>MY PROFILE</h1><div class="card" style="max-width:460px"><form id="f"><label>Full Name</label><input name="name" value="${esc(u.name)}" required><label>Mobile Number</label><input name="mobile" value="${esc(u.mobile)}" maxlength="10" required>
 <label>Gmail / Email</label><input name="email" type="email" value="${esc(u.email)}" readonly><div class="row"><div><label>BGMI / Game ID</label><input name="game_id" value="${esc(u.game_id)}"></div><div><label>In-game Name</label><input name="ign" value="${esc(u.ign)}"></div></div>
 <label>New Password (optional)</label><input name="password" type="password" minlength="6"><p class="err" id="e"></p><button class="btn">Save Profile</button></form></div>`;
 $('#f').onsubmit=sub('/api/auth/profile',r=>{USER=r;loadUser()})}
window.form=(mid,sid)=>{if(!USER){authM('login');return}const s=_sl.find(x=>x.id===sid);
 modal(`<h3>Slot #${s.number} · ₹${s.price}</h3><p class="mu">Booking as ${esc(USER.name)} · ${esc(USER.mobile)}</p><form onsubmit="book(event,${mid},${sid})"><div class="row"><div><label>BGMI / Game ID</label><input name="game_id" value="${esc(USER.game_id)}" required></div><div><label>In-game Name</label><input name="ign" value="${esc(USER.ign)}" required></div></div><p class="err" id="e"></p><button class="btn">Continue to Payment</button> <button type="button" class="btn g" onclick="closeM()">Cancel</button></form>`)};
function my(){if(!USER){authM('login');return home()}app.innerHTML='<h1>MY BOOKINGS</h1><div id="out"><div class="spin"></div></div>';
 api('/api/my-bookings',{method:'POST',body:{}}).then(r=>{$('#out').innerHTML=r.length?`<div class="grid">${r.map(b=>`<div class="card"><b>${esc(b.code)}</b> ${tag(b.status)}<p>${esc(b.match_name)} · Slot #${b.slot_number}<br>${esc(b.match_date)} ${esc(b.match_time)}</p><p>Amount: ₹${b.amount}<br>Payment: ${esc(b.pay_status||'Not submitted')}</p><p class="mu">${stMsg[b.status]}${b.note?' Note: '+esc(b.note):''}</p></div>`).join('')}</div>`:'<p class="mu">No bookings yet.</p>'}).catch(x=>$('#out').innerHTML=`<p class="err">${esc(x.message)}</p>`)}
function admin(){if(!TOKEN){app.innerHTML=`<h1>ADMIN LOGIN</h1><div class="card" style="max-width:380px"><form id="f"><label>Owner Mobile Number</label><input name="mobile" inputmode="numeric" required><label>Password</label><input name="password" type="password" required><p class="err" id="e"></p><button class="btn">Login</button><p><a href="#" onclick="forgotM('admin');return false">Forgot password?</a></p></form></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/admin/login',{method:'POST',body:fd(e.target)});TOKEN=r.token;sessionStorage.setItem('ftw_admin',TOKEN);admin()}catch(x){$('#e').textContent=x.message}};return}
 app.innerHTML=`<h1>ADMIN DASHBOARD</h1><div class="tabs">${['Overview','Matches','Pending Payments','Gamers','Payment Settings','Profile'].map((t,i)=>`<button class="btn g" onclick="tab(${i})">${t}</button>`).join('')}<button class="btn r" onclick="auth.signOut();TOKEN='';sessionStorage.clear();route()">Logout</button></div><div id="t"></div>`;tab(0)}
async function gamers(t){const r=await api('/api/admin/gamers');t.innerHTML=`<p class="mu">${r.length} registered gamers</p><div class="card tbl"><table><tr><th>#</th><th>Name</th><th>Mobile</th><th>Email</th><th>Game ID</th><th>IGN</th><th>Joined</th></tr>${r.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.name)}</td><td>${esc(g.mobile)}</td><td>${esc(g.email)}</td><td>${esc(g.game_id)}</td><td>${esc(g.ign)}</td><td>${g.created?new Date(g.created).toLocaleDateString():''}</td></tr>`).join('')}</table></div>`}
async function prof(t){const a=await api('/api/admin/profile');t.innerHTML=`<div class="card" style="max-width:460px"><form id="f"><label>Owner Name</label><input name="name" value="${esc(a.name)}" required><label>Mobile Number</label><input name="mobile" value="${esc(a.mobile)}" maxlength="10" required>
 <p class="mu">Login email: ${esc(a.email)}</p><label>New Password (optional)</label><input name="password" type="password" minlength="6"><p class="err" id="e"></p><button class="btn">Save Profile</button></form></div>`;$('#f').onsubmit=sub('/api/admin/profile')}

function support(){app.innerHTML=`<h1>SUPPORT</h1><div class="card"><p>Facing a payment or slot issue? Contact the FTW OFFICIAL ORGANIZATION team on our official channels and share your Booking ID.</p><p class="mu">Edit this section with your Discord / Telegram / WhatsApp links.</p></div>`}

// ---------- ADMIN ----------
window.tab=async i=>{const t=$('#t');t.innerHTML='<div class="spin"></div>';try{[ovw,mat,pend,gamers,sett,prof][i](t)}catch(x){t.innerHTML=`<p class="err">${esc(x.message)}</p>`}};
async function ovw(t){const s=await api('/api/admin/stats');const L={total:'Total Bookings',confirmed:'Confirmed Slots',pending:'Pending Payments',available:'Available Slots',revenue:'Total Revenue (₹)',today:"Today's Bookings"};
 t.innerHTML=`<div class="stats">${Object.keys(L).map(k=>`<div class="card stat"><b>${s[k]}</b>${L[k]}</div>`).join('')}</div>`}
async function mat(t){const ms=await api('/api/admin/matches');window._am=ms;
 t.innerHTML=`<button class="btn" onclick="mform()">+ New Match</button><div class="card tbl" style="margin-top:12px"><table><tr><th>Name</th><th>Date</th><th>Slots</th><th>Price</th><th>Booking</th><th></th></tr>${ms.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.match_date)} ${esc(m.match_time)}</td><td>${m.total_slots}</td><td>₹${m.price||0}</td><td>${m.booking_open?'Open':'Closed'}</td>
 <td><button class="btn g" onclick="aslots(${m.id})">Slots</button> <button class="btn g" onclick="mform(${m.id})">Edit</button> <button class="btn r" onclick="mdel(${m.id})">Del</button></td></tr>`).join('')}</table></div>`}
window.mform=id=>{const m=_am.find(x=>x.id===id)||{booking_open:1,total_slots:100,price:50};modal(`<h3>${id?'Edit':'New'} Match</h3><form onsubmit="msave(event,${id||0})"><label>Name</label><input name="name" value="${esc(m.name)}" required>
 <div class="row"><div><label>Date</label><input type="date" name="match_date" value="${esc(m.match_date)}" required></div><div><label>Time</label><input type="time" name="match_time" value="${esc(m.match_time)}" required></div></div>
 <div class="row"><div><label>Total Slots</label><input type="number" name="total_slots" value="${m.total_slots}" min="1" max="500" required></div><div><label>Slot Price ₹</label><input type="number" name="price" value="${m.price}" min="1" required></div></div>
 <label>Description</label><textarea name="description">${esc(m.description)}</textarea><label>Rules</label><textarea name="rules">${esc(m.rules)}</textarea>
 <label><input type="checkbox" name="booking_open" style="width:auto" ${m.booking_open?'checked':''}> Booking enabled</label><p class="err" id="e"></p><button class="btn">Save</button> <button type="button" class="btn g" onclick="closeM()">Cancel</button></form>`)};
window.msave=async(e,id)=>{e.preventDefault();const b=fd(e.target);b.booking_open=!!b.booking_open;try{await api(id?'/api/admin/matches/'+id:'/api/admin/matches',{method:id?'PUT':'POST',body:b});closeM();tab(1)}catch(x){$('#e').textContent=x.message}};
window.mdel=async id=>{if(!confirm('Delete this match and its slots?'))return;try{await api('/api/admin/matches/'+id,{method:'DELETE'});tab(1)}catch(x){alert(x.message)}};
window.aslots=async id=>{const d=modal('<div class="spin"></div>');const s=await api(`/api/admin/matches/${id}/slots`);
 d.firstChild.innerHTML=`<h3>Slots</h3><p class="mu">Tap an available slot to edit its price.</p><div class="slots">${s.map(x=>`<div class="slot ${x.status}" onclick="${x.status==='available'?`sprice(${x.id},${x.price},${id})`:''}"><b>#${x.number}</b>₹${x.price}<br>${x.status}${x.code?'<br>'+esc(x.code):''}</div>`).join('')}</div><p><button class="btn g" onclick="closeM()">Close</button></p>`};
window.sprice=async(id,p,mid)=>{const v=prompt('New price ₹',p);if(!v)return;try{await api('/api/admin/slots/'+id,{method:'PUT',body:{price:+v}});aslots(mid)}catch(x){alert(x.message)}};
async function pend(t){const r=await api('/api/admin/bookings?status=PENDING_VERIFICATION');
 t.innerHTML=r.length?`<div class="card tbl"><table><tr><th>Gamer</th><th>Mobile</th><th>Game ID</th><th>Match / Slot</th><th>₹</th><th>UTR</th><th>Time</th><th>Proof</th><th></th></tr>${r.map(b=>`<tr><td>${esc(b.name)}<br><span class="mu">${esc(b.ign)}</span></td><td>${esc(b.mobile)}</td><td>${esc(b.game_id)}</td><td>${esc(b.match_name)} #${b.slot_number}</td><td>${b.amount}</td><td>${esc(b.utr)}</td><td>${new Date(b.created_at).toLocaleString()}</td>
 <td><button class="btn g" onclick="shot('${esc(b.screenshot)}')">View</button></td><td><button class="btn o" onclick="act(${b.id},'approve')">Approve</button> <button class="btn r" onclick="act(${b.id},'reject')">Reject</button></td></tr>`).join('')}</table></div>`:'<p class="mu">No pending payments 🎉</p>'}
window.act=async(id,a)=>{const note=a==='reject'?prompt('Reason (shown to gamer, optional)')||'':'';if(!confirm(a.toUpperCase()+' this payment?'))return;try{await api(`/api/admin/bookings/${id}/${a}`,{method:'POST',body:{note}});tab(2)}catch(x){alert(x.message);tab(2)}};
window.shot=async f=>{const d=modal('<div class="spin"></div>');try{const u=URL.createObjectURL(await api('/api/admin/shot/'+f,{blob:1}));
 d.firstChild.innerHTML=`<p class="mu">Click image to zoom</p><div class="zoom"><img src="${u}" onclick="this.classList.toggle('z')"></div><p><button class="btn g" onclick="closeM()">Close</button></p>`;d.firstChild.style.maxWidth='720px'}catch(x){d.firstChild.textContent=x.message}};
async function sett(t){const s=await api('/api/admin/settings');
 t.innerHTML=`<div class="card" style="max-width:480px"><form id="f"><label>UPI ID / VPA</label><input name="upi_id" value="${esc(s.upi_id)}" required><label>UPI Payee Name</label><input name="payee" value="${esc(s.payee)}" required>
 <label>Default slot price ₹</label><input name="default_price" type="number" value="${s.default_price}"><label>Payment Instructions</label><textarea name="instructions">${esc(s.instructions)}</textarea><p class="err" id="e"></p><button class="btn">Save</button></form></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/settings',{method:'PUT',body:fd(e.target)});$('#e').style.color='var(--ok)';$('#e').textContent='Saved. New QR codes use these details.'}catch(x){$('#e').style.color='var(--er)';$('#e').textContent=x.message}}}
</script></body></html>
